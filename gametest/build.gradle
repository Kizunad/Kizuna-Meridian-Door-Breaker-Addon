plugins { id 'fabric-loom' }

description = '独立 GameTest 装配，验证真实目录、按卷学习和原版数据注册表。'

dependencies {
    minecraft libs.minecraft
    mappings "net.fabricmc:yarn:${libs.versions.yarn.get()}:v2"
    modImplementation libs.fabric.loader
    modImplementation libs.fabric.api
    implementation project(':verification')
    modImplementation('dev.kizuna.meridian.technique:fabric') { transitive = false }
}

processResources {
    from(project(':fabric').sourceSets.main.resources) { exclude 'fabric.mod.json' }
    from(project(':shared').sourceSets.main.resources)
}

loom {
    mods {
        meridian_door_breaker_test { sourceSet sourceSets.main }
    }
    runs {
        gametest {
            server()
            name '破门斩数据 GameTest'
            runDir 'build/gametest'
            vmArg '-Dfabric-api.gametest'
            vmArg '-Dfabric-api.gametest.report-file=build/gametest-results.xml'
            vmArg "-DdoorBreaker.blockItemsReport=${layout.buildDirectory.file('block-items.json').get().asFile}"
        }
    }
}
